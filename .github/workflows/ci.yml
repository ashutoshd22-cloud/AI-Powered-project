name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: lifeos
          POSTGRES_PASSWORD: lifeos
          POSTGRES_DB: lifeos_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lifeos" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      LIFEOS_ENV_FILE: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check app tests && ruff format --check app tests
      - name: Type check
        run: mypy app
      - name: Tests (SQLite)
        run: pytest --cov --cov-report=term
      - name: Tests (PostgreSQL)
        env:
          TEST_DATABASE_URL: postgresql+psycopg://lifeos:lifeos@localhost:5432/lifeos_test
        run: pytest
      - name: Migrations apply cleanly and match the models (PostgreSQL)
        env:
          DATABASE_URL: postgresql+psycopg://lifeos:lifeos@localhost:5432/lifeos_test
        run: |
          python -c "from sqlalchemy import create_engine, text; e=create_engine('postgresql+psycopg://lifeos:lifeos@localhost:5432/lifeos_test'); c=e.connect(); c.execute(text('DROP SCHEMA public CASCADE; CREATE SCHEMA public')); c.commit()"
          alembic upgrade head
          alembic check
          alembic downgrade base
      - name: Dependency audit
        run: pip-audit -r requirements.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      LIFEOS_ENV_FILE: ""
      DATABASE_URL: sqlite:///./e2e.db
      REGISTER_LIMIT_PER_HOUR: "1000"
      LLM_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pip install -r backend/requirements.txt
      - name: Start API
        working-directory: backend
        run: |
          alembic upgrade head
          nohup uvicorn app.main:app --port 8000 > ../api.log 2>&1 &
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx playwright test
        working-directory: frontend
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            frontend/test-results
            api.log

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t lifeos:ci .
      - name: Smoke test the image
        run: |
          docker run -d --name lifeos -e DATABASE_URL=sqlite:////tmp/lifeos.db -e LIFEOS_ENV_FILE= -p 8000:8000 lifeos:ci
          for i in $(seq 1 30); do curl -fsS http://localhost:8000/api/health && break; sleep 2; done
          curl -fsS http://localhost:8000/ | grep -q '<div id="root">'
          docker logs lifeos
