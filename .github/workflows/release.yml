name: Release

# Pushing a version tag (e.g. `git tag v1.1.0 && git push origin v1.1.0`) publishes the Docker image to
# GitHub Container Registry and creates a GitHub Release with that version's CHANGELOG section.
# It can also be started by hand (Actions → Release → Run workflow) for an existing tag.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, e.g. v1.1.0"
        required: true

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/lifeos
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  image:
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.publish.outputs.published }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Build
        run: |
          VERSION="${TAG#v}"
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.version=${VERSION}" \
            --label "org.opencontainers.image.licenses=MIT" \
            --label "org.opencontainers.image.description=LifeOS - personal AI operating system (API + web app)" \
            -t "${IMAGE}:${VERSION}" -t "${IMAGE}:latest" .
      - name: Smoke test
        run: |
          # Exactly the command shown in the release notes (named volume, non-root user).
          docker run -d --name lifeos -p 8000:8000 -e DATABASE_URL=sqlite:////data/lifeos.db -v lifeos:/data "${IMAGE}:latest"
          for i in $(seq 1 30); do curl -fsS http://localhost:8000/api/health && break; sleep 2; done
          curl -fsS http://localhost:8000/ | grep -q '<div id="root">' || { docker logs lifeos; exit 1; }
      - name: Publish
        id: publish
        run: |
          # Failures are reported as annotations so they are visible on the run's summary page.
          report() { echo "::error title=Publishing the image failed::$(tr '\n' ' ' < "$1" | cut -c1-900)"; exit 1; }
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin > out.txt 2>&1 || report out.txt
          docker push "${IMAGE}:${TAG#v}" > out.txt 2>&1 || report out.txt
          docker push "${IMAGE}:latest" > out.txt 2>&1 || report out.txt
          echo "published=true" >> "$GITHUB_OUTPUT"

  release:
    runs-on: ubuntu-latest
    needs: image
    # The release page is still created when only the image upload failed.
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Release notes from CHANGELOG
        env:
          PUBLISHED: ${{ needs.image.outputs.published }}
        run: |
          VERSION="${TAG#v}"
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 {on=1; next}
            on && substr($0, 1, 4) == "## [" {exit}
            on {print}
          ' CHANGELOG.md > notes.md
          test -s notes.md || { echo "::error::No CHANGELOG section for $VERSION"; exit 1; }
          if [ "$PUBLISHED" = "true" ]; then
            {
              echo
              echo "### Run it"
              echo '```bash'
              echo "docker run -p 8000:8000 -e DATABASE_URL=sqlite:////data/lifeos.db -v lifeos:/data ${IMAGE}:${VERSION}"
              echo '```'
              echo "Then open http://localhost:8000. For PostgreSQL, the worker and local AI use \`docker compose\` (see README)."
            } >> notes.md
          fi
      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --title "LifeOS $TAG" --notes-file notes.md
          else
            gh release create "$TAG" --title "LifeOS $TAG" --notes-file notes.md --verify-tag
          fi
