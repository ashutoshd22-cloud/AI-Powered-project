[project]
name = "lifeos-backend"
version = "1.0.0"
description = "LifeOS — personal AI operating system (API and background worker)"
requires-python = ">=3.12"
readme = "../README.md"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = [
  "S101",   # asserts are used for type narrowing
  "B008",   # FastAPI dependency defaults
  "RUF001", # typographic quotes in user-facing strings are intentional
  "UP031",  # %-formatting is clearer for the regexes in nlp.py
  "SIM102", "SIM108",  # explicit if-blocks read better in the query builders
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S107", "S311", "E501"]
# Long regular expressions read better on one line.
"app/services/ai.py" = ["E501"]
"app/services/nlp.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning:icalendar.*"]

[tool.coverage.run]
source = ["app"]
omit = ["app/worker.py"]
